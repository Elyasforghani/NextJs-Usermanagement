<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3D Scroll Trigger Animation</title>
	<style>
		body {
			margin: 0;
			font-family: sans-serif;
			background-color: #111;
			color: #fff;
		}

		/* The 3D canvas stays fixed full-screen in the background */
		#webgl-container {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			z-index: 1;
		}

		/* Content sections create the vertical scroll distance */
		.section {
			position: relative;
			z-index: 2;
			height: 100vh;
			display: flex;
			align-items: center;
			padding-left: 10%;
			pointer-events: none; /* Allows scrolling through text */
		}

		.content-box {
			background: rgba(0, 0, 0, 0.6);
			padding: 2rem;
			border-radius: 12px;
			max-width: 400px;
			backdrop-filter: blur(5px);
		}
	</style>
</head>
<body>

	<!-- Canvas container -->
	<div id="webgl-container"></div>

	<!-- Scrollable Content Sections -->
	<section class="section">
		<div class="content-box">
			<h1>Idle State</h1>
			<p>Scroll down to transition the character from standing to walking.</p>
		</div>
	</section>

	<section class="section">
		<div class="content-box">
			<h1>Walking State</h1>
			<p>The character transitions into a walk cycle as you scroll into this section.</p>
		</div>
	</section>

	<section class="section">
		<div class="content-box">
			<h1>Running State</h1>
			<p>Continuing to scroll blends the animation into a full sprint.</p>
		</div>
	</section>

	<!-- Import Map -->
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
				"gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm",
				"gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/ScrollTrigger/+esm"
			}
		}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import gsap from 'gsap';
		import { ScrollTrigger } from 'gsap/ScrollTrigger';

		gsap.registerPlugin(ScrollTrigger);

		let scene, camera, renderer, mixer, clock;
		let idleAction, walkAction, runAction;

		// Animation weights targeted by GSAP ScrollTrigger
		const weights = { idle: 1.0, walk: 0.0, run: 0.0 };

		init();

		function init() {
			const container = document.getElementById('webgl-container');

			camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100);
			camera.position.set(0, 1.5, -3);
			camera.lookAt(0, 1, 0);

			clock = new THREE.Clock();
			scene = new THREE.Scene();
			scene.background = new THREE.Color(0x111111);

			// Lighting
			const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
			scene.add(hemiLight);

			const dirLight = new THREE.DirectionalLight(0xffffff, 3);
			dirLight.position.set(-3, 10, -10);
			scene.add(dirLight);

			// Ground
			const ground = new THREE.Mesh(
				new THREE.PlaneGeometry(100, 100),
				new THREE.MeshStandardMaterial({ color: 0x222222 })
			);
			ground.rotation.x = -Math.PI / 2;
			scene.add(ground);

			// Load GLB Model
			const loader = new GLTFLoader();
			loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf) => {
				const model = gltf.scene;
				scene.add(model);

				const animations = gltf.animations;
				mixer = new THREE.AnimationMixer(model);

				idleAction = mixer.clipAction(animations[0]);
				walkAction = mixer.clipAction(animations[3]);
				runAction = mixer.clipAction(animations[1]);

				[idleAction, walkAction, runAction].forEach(a => { a.enabled = true; a.play(); });

				// Set up ScrollTrigger bindings after model is loaded
				setupScrollAnimations(model);

				renderer.setAnimationLoop(animate);
			});

			// Renderer Setup
			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			container.appendChild(renderer.domElement);

			window.addEventListener('resize', onWindowResize);
		}

		function setupScrollAnimations(model) {
			// 1. Scrub animation blend weights based on scroll progress
			const tl = gsap.timeline({
				scrollTrigger: {
					trigger: "body",
					start: "top top",
					end: "bottom bottom",
					scrub: 0.5 // Smooth scrubbing effect
				}
			});

			// Transition Idle -> Walk -> Run along scroll height
			tl.to(weights, { idle: 0, walk: 1, run: 0, ease: "none" })
			  .to(weights, { idle: 0, walk: 0, run: 1, ease: "none" });

			// 2. Rotate or move the model along with scroll
			gsap.to(model.rotation, {
				y: Math.PI * 2,
				scrollTrigger: {
					trigger: "body",
					start: "top top",
					end: "bottom bottom",
					scrub: 1
				}
			});
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function animate() {
			const delta = clock.getDelta();

			if (mixer) {
				// Apply GSAP-controlled weights to the skinning actions
				idleAction.setEffectiveWeight(weights.idle);
				walkAction.setEffectiveWeight(weights.walk);
				runAction.setEffectiveWeight(weights.run);

				mixer.update(delta);
			}

			renderer.render(scene, camera);
		}
	</script>
</body>
</html>
